<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificados Lab Nana</title>
    <style>
        /* CSS3 Moderno con Variables y Mobile-First */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
        }

        .search-card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
        }

        .search-card h2 {
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .search-card p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        #status-message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
            text-align: center;
        }

        .error {
            background-color: #fee2e2;
            color: var(--error-color);
            border: 1px solid #fecaca;
        }

        .success {
            background-color: #dcfce7;
            color: var(--success-color);
            border: 1px solid #bbf7d0;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .support-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .support-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        @media (min-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            .search-card {
                margin-top: 3rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal de Consulta de Certificado</h1>
    </header>

    <main>
        <section class="search-card" role="search">
            <h2>Búsqueda Individual</h2>
            <p>Ingrese su número de identificación para descargar su certificado.</p>
            
            <form id="search-form">
                <div class="form-group">
                    <label for="doc-id">Número de Documento</label>
                    <input 
                        type="text" 
                        id="doc-id" 
                        name="doc-id" 
                        placeholder="Ej: 1001" 
                        required
                        aria-label="Ingrese su número de documento"
                    >
                </div>
                <button type="submit" id="submit-btn">Consultar Documento</button>
            </form>

            <div id="status-message" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Laboratorio Nanita. Los Derechos Reservados</p>
        <a href="https://wa.me/573155257405" class="support-link" target="_blank" rel="noopener noreferrer">
            Contactar Soporte Técnico
        </a>
    </footer>

    <script>
        const searchForm = document.getElementById('search-form');
        const statusMessage = document.getElementById('status-message');
        const submitBtn = document.getElementById('submit-btn');

        // Carpeta en GitHub con D mayúscula
        const PDF_FOLDER_PATH = './Documentos/'; 

        const displayMessage = (text, type) => {
            statusMessage.textContent = text;
            statusMessage.className = type;
            statusMessage.style.display = 'block';
        };

        const checkFileExists = async (url) => {
            try {
                const response = await fetch(url, { method: 'HEAD', cache: 'no-cache' });
                return response.ok;
            } catch (error) {
                return false;
            }
        };

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const docId = document.getElementById('doc-id').value.trim();
            if (!docId) return;

            statusMessage.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Buscando...';

            const fileName = `${docId}.pdf`;
            const fileUrl = `${PDF_FOLDER_PATH}${fileName}`;

            const exists = await checkFileExists(fileUrl);

            if (exists) {
                displayMessage('Documento encontrado. Se abrirá en una nueva pestaña.', 'success');
                window.open(fileUrl, '_blank');
            } else {
                displayMessage(`No se encontró el documento "${fileName}" en la carpeta "Documentos".`, 'error');
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Consultar Documento';
        });
    </script>
</body>
</html>
